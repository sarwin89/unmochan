name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_io:
        description: Run optional real DFT I/O fixtures
        required: false
        default: "false"

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev,io,plot]"

      - name: Test
        run: python -m pytest -m "not slow and not io_real" --basetemp .tmp-pytest -p no:cacheprovider

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src/unmochan

      - name: Compile
        run: python -m compileall src/unmochan tests examples

      - name: Dependency check
        run: python -m pip check

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        run: |
          python -m pip install build
          python -m build
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('*.whl')); names = ZipFile(wheel).namelist(); assert any(name.startswith('unmochan/') for name in names); assert not any(name.startswith('unfoldlab/') for name in names)"

      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install dist/*.whl
          python -c "import unmochan; assert unmochan.__version__ == '0.1.0'"
          python -c "import importlib.util; assert importlib.util.find_spec('unfoldlab') is None"
          unmochan --help
          test ! -e .venv-smoke/bin/unfoldlab

  real-io:
    name: Optional real DFT I/O
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_io == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev,io,plot]"

      - name: Run real-I/O tests
        run: python -m pytest -m io_real
