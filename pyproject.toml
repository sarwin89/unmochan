[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unmochan"
version = "0.1.0"
description = "UNfolding MOmentum-space Crystal Hamiltonian ANalysis for VASP, Quantum ESPRESSO, and model Hamiltonians."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "Unmochan contributors" }]
dependencies = [
  "click>=8.1",
  "numpy>=1.23",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
io = [
  "ase>=3.22",
  "h5py>=3.10",
  "pymatgen>=2024.5",
]
plot = [
  "matplotlib>=3.8",
  "plotly>=5.20",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
unmochan = "unfoldlab.cli.main:main"
unfoldlab = "unfoldlab.cli.main:unfoldlab_main"

[tool.hatch.build.targets.wheel]
packages = ["unfoldlab", "unmochan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: fast unit tests for core algorithms and parsers",
  "cli: command-line and guided-mode tests",
  "integration: end-to-end synthetic workflow tests",
  "parity: backend-neutral VASP/QE equivalence tests",
  "plot: tests that generate or validate plots",
  "slow: longer-running checks excluded from the default tight loop",
  "io_real: optional tests that require real external DFT output fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["h5py.*"]
ignore_missing_imports = true
